<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Conectar o celular à tela do Pipper</title>
  <desc id="desc">Na mesma rede local, use o IP mostrado no computador e a porta 5900 no cliente VNC do celular. Exemplo: 192.168.1.42.</desc>
  <rect width="1000" height="360" rx="24" fill="#2e3440"/>
  <g font-family="sans-serif" fill="#eceff4">
    <text x="50" y="52" font-size="25" font-weight="bold">Sua segunda tela, na mesma rede</text>
    <rect x="50" y="88" width="340" height="190" rx="16" fill="#3b4252" stroke="#88c0d0" stroke-width="3"/>
    <text x="78" y="125" font-size="21" font-weight="bold">1. Computador · Pipper</text>
    <text x="78" y="166" font-size="18">Ligue a tela virtual</text>
    <text x="78" y="202" font-size="18">Copie o IP mostrado no app</text>
    <text x="78" y="246" font-size="23" fill="#88c0d0">192.168.1.42</text>
    <path d="M420 185h140m-18-14 18 14-18 14" fill="none" stroke="#88c0d0" stroke-width="4" stroke-linecap="round"/>
    <text x="490" y="150" text-anchor="middle" font-size="16">Wi-Fi / LAN</text>
    <rect x="590" y="88" width="360" height="190" rx="16" fill="#3b4252" stroke="#a3be8c" stroke-width="3"/>
    <text x="618" y="125" font-size="21" font-weight="bold">2. Celular · Cliente VNC</text>
    <text x="618" y="166" font-size="18">Endereço: 192.168.1.42</text>
    <text x="618" y="202" font-size="18">Porta: 5900</text>
    <text x="618" y="246" font-size="23" fill="#a3be8c">Conectar</text>
    <text x="50" y="323" font-size="17" fill="#d8dee9">IP ilustrativo. Use o endereço da sua rede mostrado no Pipper.</text>
  </g>
</svg>
