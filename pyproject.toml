[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipper"
dynamic = ["version"]
description = "Turn a smartphone into a wireless second monitor for Hyprland"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pipper contributors"}]
dependencies = ["PyGObject>=3.46", "tomlkit>=0.12"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]

[project.optional-dependencies]
qr = ["qrcode>=7.4"]

[project.scripts]
pipper = "pipper_app.cli:main"

[tool.setuptools]
packages = ["pipper_app"]
package-dir = {pipper_app = "src"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "pipper_app.__version__"}

[tool.setuptools.package-data]
pipper_app = ["devices.json", "style.css"]

[tool.setuptools.data-files]
"share/applications" = ["data/pipper.desktop"]
"share/pipper/icons" = ["data/icons/pipper.png", "data/icons/pipper.svg"]
"share/icons/hicolor/scalable/apps" = ["data/icons/hicolor/scalable/apps/pipper.svg"]
"share/icons/hicolor/16x16/apps" = ["data/icons/hicolor/16x16/apps/pipper.png"]
"share/icons/hicolor/24x24/apps" = ["data/icons/hicolor/24x24/apps/pipper.png"]
"share/icons/hicolor/32x32/apps" = ["data/icons/hicolor/32x32/apps/pipper.png"]
"share/icons/hicolor/48x48/apps" = ["data/icons/hicolor/48x48/apps/pipper.png"]
"share/icons/hicolor/64x64/apps" = ["data/icons/hicolor/64x64/apps/pipper.png"]
"share/icons/hicolor/96x96/apps" = ["data/icons/hicolor/96x96/apps/pipper.png"]
"share/icons/hicolor/128x128/apps" = ["data/icons/hicolor/128x128/apps/pipper.png"]
"share/icons/hicolor/256x256/apps" = ["data/icons/hicolor/256x256/apps/pipper.png"]
"share/icons/hicolor/512x512/apps" = ["data/icons/hicolor/512x512/apps/pipper.png"]
